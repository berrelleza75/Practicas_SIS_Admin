services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: p12_mailserver
    hostname: ${MAIL_HOSTNAME}
    restart: always
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - /opt/practica12/dms/mail-data/:/var/mail/
      - /opt/practica12/dms/mail-state/:/var/mail-state/
      - /opt/practica12/dms/mail-logs/:/var/log/mail/
      - /opt/practica12/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - ENABLE_POLICYD_SPF=1
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/tmp/docker-mailserver/ssl/mail.reprobados.com-cert.pem
      - SSL_KEY_PATH=/tmp/docker-mailserver/ssl/mail.reprobados.com-key.pem
      - PERMIT_DOCKER=connected-networks
      - SPOOF_PROTECTION=0
    cap_add:
      - NET_ADMIN
    networks:
      - mailnet

  mariadb:
    image: mariadb:11
    container_name: p12_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - mailnet
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: p12_roundcube
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: mariadb
      ROUNDCUBEMAIL_DB_USER: ${MARIADB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${MARIADB_PASSWORD}
      ROUNDCUBEMAIL_DB_NAME: ${MARIADB_DATABASE}
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://mailserver
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_USERNAME_DOMAIN: ${MAIL_DOMAIN}
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve
      ROUNDCUBEMAIL_IMAP_CONN_OPTIONS: '{"ssl":{"verify_peer":false,"verify_peer_name":false,"allow_self_signed":true}}'
      ROUNDCUBEMAIL_SMTP_CONN_OPTIONS: '{"ssl":{"verify_peer":false,"verify_peer_name":false,"allow_self_signed":true}}'
    volumes:
      - /opt/practica12/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php
    networks:
      - mailnet

volumes:
  mariadb_data:

networks:
  mailnet:
    driver: bridge
